<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>PocketBasketball</title>
<meta name="description" content="5-on-5 basketball for your phone, played in portrait. Your career from draft night on.">
<meta name="theme-color" content="#0a0d14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PocketBB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="rotate" aria-live="polite"><div><b>⟳</b><p>Turn your phone upright</p><small>PocketBasketball plays in portrait.</small></div></div>
<div id="app">
  <div id="game" hidden>
    <canvas id="gl"></canvas>
    <div id="hud">
      <div class="bug">
        <div class="side" id="sd0"><i></i><b id="a0"></b><s id="t0"></s><u id="s0">0</u></div>
        <div class="mid"><span id="qt">1st</span><b id="clk">3:00</b></div>
        <div class="side r" id="sd1"><u id="s1">0</u><s id="t1"></s><b id="a1"></b><i></i></div>
        <div id="sc">24</div>
      </div>
      <div class="sub"><button id="pz" aria-label="Pause"><span></span><span></span></button><div id="grade"></div><div id="line"></div><div id="energy" hidden title="Stamina"><i></i></div>
        <div id="zm"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button></div></div>
      <div id="feed"></div>
      <canvas id="radar" width="56" height="104" hidden></canvas>
    </div>
    <div id="toast"></div><div id="rel"></div><div id="ftmsg" hidden></div>
    <div id="tipcard" hidden></div>
    <div id="intro" hidden></div>
    <button id="rp" hidden><i></i>REPLAY<small>tap to skip</small></button>
    <div id="meter" hidden><div class="tube"><i id="mzone"></i><u id="mfill"></u></div></div>
    <div id="stickzone"><div id="stickbase"><div id="knob"></div></div><p class="hint">Drag to move</p></div>
    <div id="btns"><button class="btn a shoot" id="bA">Shoot</button><button class="btn b" id="bB">Pass</button><button class="btn c" id="bC">Move</button><button class="btn d" id="bD">Pick</button><button id="tko" hidden aria-label="Takeover"><i></i><b>Takeover</b></button></div>
    <div id="pause" hidden></div>
  </div>
  <div id="screen"></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"}}</script>
<script type="module">
/* three.js and its glTF loader come in as modules; the game's own files are classic scripts that read window.THREE,
   so they are added here, in order, once the library is in. */
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
window.THREE = THREE;
window.THREE_ADDONS = { GLTFLoader, SkeletonUtils };
const files = ['js/data.js', 'js/court.js', 'js/sfxpack.js', 'js/vo.js', 'js/audio.js', 'js/booth.js', 'js/game.js', 'js/career.js', 'js/season.js'];
for (const f of files) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = f; s.async = false; s.onload = ok; s.onerror = no; document.body.appendChild(s); });
PB.boot();
/* offline play: only on the real site, never on a local test server */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
